<style>
:root{--r:12px;--font:"Cairo","Segoe UI",Roboto,Arial,sans-serif;--brand:"Orbitron","Cairo","Segoe UI",sans-serif;--mono:ui-monospace,"Cascadia Mono",Consolas,monospace}
[data-theme=dark]{--bg:#070707;--bg2:#0f0f10;--panel:#141416;--panel2:#1c1c20;--border:#2a2a30;--text:#f2f2f2;--muted:#9a9aa3;--orange:#ff7a1a;--orange2:#ff9a3d;--blue:#29b6f6;--ok:#38c172;--warn:#ffb020;--danger:#ff3b30;--shadow:0 6px 24px rgba(0,0,0,.45);--glow:0 0 22px rgba(255,122,26,.25)}
[data-theme=light]{--bg:#f3f4f6;--bg2:#e9eaee;--panel:#ffffff;--panel2:#f6f6f8;--border:#dcdde3;--text:#141414;--muted:#5f6370;--orange:#e8650a;--orange2:#ff7a1a;--blue:#0288d1;--ok:#1e9e55;--warn:#c98200;--danger:#d92d20;--shadow:0 4px 16px rgba(0,0,0,.08);--glow:0 0 0 rgba(0,0,0,0)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.45}
body{min-height:100vh;background:radial-gradient(1200px 600px at 50% -200px,rgba(255,122,26,.10),transparent 60%),radial-gradient(900px 500px at 100% 100%,rgba(41,182,246,.06),transparent 60%),var(--bg)}
a{color:var(--orange)}
button,input,select,textarea{font-family:inherit;font-size:15px}
.hidden{display:none!important}
.brand{font-family:var(--brand);letter-spacing:.12em;font-weight:900}
.muted{color:var(--muted)}.small{font-size:12.5px}.mono{font-family:var(--mono)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>.grow{flex:1}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:620px){.grid2,.grid3{grid-template-columns:1fr}}
.btn{border:1px solid var(--orange);background:var(--orange);color:#000;font-weight:700;border-radius:10px;padding:10px 16px;cursor:pointer;min-height:42px;transition:.15s}
.btn:hover{filter:brightness(1.08)}.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--orange)}.btn.dark{background:var(--panel2);border-color:var(--border);color:var(--text)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.sm{padding:6px 10px;min-height:32px;font-size:13px}
.icon-btn{background:var(--panel);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:700}
input,select,textarea{width:100%;background:var(--bg2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--orange);box-shadow:var(--glow)}
label{display:block;font-size:12.5px;color:var(--muted);margin:8px 0 4px;font-weight:600}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);margin-bottom:14px}
.panel h3{margin:0 0 10px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.panel h3::before{content:"";width:4px;height:16px;background:var(--orange);border-radius:2px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);border-radius:999px;padding:4px 10px;font-size:12.5px;font-weight:700;background:var(--panel2)}
.chip.on{background:var(--orange);color:#000;border-color:var(--orange)}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:11.5px;font-weight:800;border:1px solid currentColor}
.sev1{color:var(--blue)}.sev2{color:var(--orange2)}.sev3{color:var(--warn)}.sev4{color:var(--danger)}
.ok-t{color:var(--ok)}.warn-t{color:var(--warn)}.bad-t{color:var(--danger)}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--muted)}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--danger)}.dot.warn{background:var(--warn)}
.switch{position:relative;width:52px;height:30px;flex:0 0 auto}.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;background:var(--panel2);border:1px solid var(--border);border-radius:999px;cursor:pointer;transition:.2s}
.switch span::after{content:"";position:absolute;width:22px;height:22px;top:3px;inset-inline-start:3px;background:var(--muted);border-radius:50%;transition:.2s}
.switch input:checked+span{background:var(--orange);border-color:var(--orange)}.switch input:checked+span::after{background:#000;inset-inline-start:25px}
/* ---------------- login */
#login{min-height:100vh;display:flex;flex-direction:column}
.login-top{display:flex;justify-content:space-between;align-items:center;padding:14px 18px}
.login-main{flex:1;display:flex;align-items:center;justify-content:center;gap:48px;padding:10px 20px 30px;flex-wrap:wrap}
.login-hero{max-width:560px;text-align:center}
.login-hero img{width:100%;max-width:520px;border-radius:18px;filter:drop-shadow(0 10px 40px rgba(255,122,26,.25))}
.login-hero h1{font-family:var(--brand);font-size:clamp(40px,8vw,74px);margin:6px 0 0;letter-spacing:.14em;background:linear-gradient(90deg,var(--orange),#ffd0a0,var(--blue));-webkit-background-clip:text;background-clip:text;color:transparent}
.login-hero p{margin:4px 0;color:var(--muted)}
.login-card{width:100%;max-width:400px;background:var(--panel);border:1px solid var(--border);border-radius:18px;padding:22px;box-shadow:var(--shadow),var(--glow)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;color:var(--text);padding:10px;border-radius:9px;font-weight:800;cursor:pointer}
.seg button.on{background:var(--orange);color:#000}
.supervisors{margin-top:14px;border-top:1px solid var(--border);padding-top:12px;font-size:13.5px}
.supervisors div{display:flex;justify-content:space-between;gap:10px;padding:2px 0}
.qr-card{display:flex;gap:14px;align-items:center;margin-top:14px;padding:12px;border:1px dashed var(--orange);border-radius:12px}
.qr-card canvas{background:#fff;border-radius:8px;padding:6px;width:110px;height:110px;flex:0 0 auto}
/* ---------------- app shell */
header.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--border)}
header.top img{width:38px;height:38px;border-radius:50%;object-fit:cover}
header.top .brand{color:var(--orange);font-size:20px}
.status-dots{display:flex;gap:10px;font-size:12px;color:var(--muted);align-items:center;min-width:0;overflow:hidden;flex:1}
@media(max-width:560px){header.top{gap:6px;padding:8px 10px}header.top .brand{font-size:15px}header.top img{width:30px;height:30px}.status-dots .who{display:none}.status-dots{gap:6px;font-size:11px}header.top .icon-btn{padding:6px 8px}}
input[type=range]{accent-color:var(--orange);padding:0;border:0;background:none}
.wrap{max-width:1100px;margin:0 auto;padding:14px 14px 96px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;display:flex;justify-content:space-around;background:var(--panel);border-top:1px solid var(--border);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;background:none;border:0;color:var(--muted);font-weight:700;font-size:11.5px;padding:6px 2px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button.on{color:var(--orange)}
.mode-banner{background:linear-gradient(90deg,rgba(255,122,26,.18),rgba(41,182,246,.12));border:1px solid var(--orange);border-radius:10px;padding:8px 12px;font-size:13px;margin-bottom:12px}
.gauge{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:10px;text-align:center}
.gauge b{display:block;font-family:var(--mono);font-size:24px;color:var(--orange)}
.gauge span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.list-item{background:var(--panel2);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer}
.list-item:hover{border-color:var(--orange)}
.estop{width:100%;min-height:72px;font-size:22px;font-weight:900;letter-spacing:.06em;border-radius:14px;border:3px solid #fff3;background:radial-gradient(circle at 50% 30%,#ff5a50,#b80f08);color:#fff;cursor:pointer;box-shadow:0 0 28px rgba(255,59,48,.45)}
.estop:active{transform:scale(.98)}
.dpad{display:grid;grid-template-columns:repeat(3,92px);grid-template-rows:repeat(3,92px);gap:10px;justify-content:center;margin:10px auto;direction:ltr}
.dpad button{border-radius:18px;border:2px solid var(--orange);background:var(--panel2);color:var(--text);font-weight:800;font-size:13px;cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none}
.dpad button.held{background:var(--orange);color:#000}.dpad button:disabled{opacity:.35;border-color:var(--border)}
.dpad .stop{background:var(--danger);border-color:var(--danger);color:#fff;border-radius:50%}
.dist{display:grid;grid-template-columns:70px 1fr 80px;gap:10px;align-items:center;margin:8px 0}
.dist .bar{height:16px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.dist .bar i{display:block;height:100%;border-radius:8px;transition:width .25s}
.video{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}
.video img,.video canvas{width:100%;height:100%;object-fit:contain}
.video .badge{position:absolute;top:10px;inset-inline-start:10px;background:#000a;color:#ff4d40;font-weight:800;font-family:var(--mono);padding:3px 8px;border-radius:6px;font-size:12px}
.thumbs{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.thumbs .t{flex:0 0 auto;width:130px;border-radius:8px;overflow:hidden;background:var(--panel2);border:1px solid var(--border);cursor:pointer;font-size:11px}
.thumbs .t img{width:130px;height:90px;object-fit:cover;display:block}
.cells{display:grid;gap:4px;grid-template-columns:repeat(auto-fill,minmax(54px,1fr))}
.cell{border-radius:6px;padding:4px;text-align:center;font-family:var(--mono);font-size:11px;border:1px solid var(--border)}
.cell.ok{background:color-mix(in srgb,var(--ok) 22%,transparent)}.cell.warn{background:color-mix(in srgb,var(--warn) 35%,transparent)}
.cell.bad{background:color-mix(in srgb,var(--danger) 45%,transparent);color:#fff}.cell.missing{opacity:.5}
.modal{position:fixed;inset:0;background:#000a;z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal .box{background:var(--panel);border:1px solid var(--border);border-radius:16px;max-width:720px;width:100%;max-height:92vh;overflow:auto;padding:18px}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);z-index:60;background:var(--panel);border:1px solid var(--orange);color:var(--text);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);max-width:90vw}
.check{display:flex;gap:10px;align-items:flex-start;padding:6px 0}.check input{width:20px;height:20px;flex:0 0 auto;margin-top:2px;accent-color:var(--orange)}
table.t{width:100%;border-collapse:collapse;font-size:13px}table.t td,table.t th{border-bottom:1px solid var(--border);padding:6px;text-align:start}
/* ---------------- printable report */
#report{display:none}
@media print{
  body{background:#fff!important;color:#111}
  body>*:not(#report){display:none!important}
  #report{display:block!important;color:#111;font-size:11.5px}
  #report .rp-h{display:flex;align-items:center;gap:14px;background:#0a0a0a!important;color:#fff;padding:10px 14px;border-bottom:4px solid #ff7a1a;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #report img{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .cell{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  @page{size:A4;margin:12mm}
}
#reportView .rp-h,#report .rp-h{display:flex;align-items:center;gap:14px;background:#0a0a0a;color:#fff;padding:10px 14px;border-bottom:4px solid #ff7a1a;border-radius:8px 8px 0 0}
.rp h4{margin:14px 0 6px;border-inline-start:4px solid #ff7a1a;padding-inline-start:8px}
.rp table{width:100%;border-collapse:collapse}.rp td,.rp th{border:1px solid #ccc;padding:4px 6px;text-align:start;vertical-align:top}
.rp .sig{display:grid;grid-template-columns:1fr 1fr;gap:30px;margin-top:30px}.rp .sig div{border-top:1px solid #333;padding-top:4px}
</style>
</head>

متسببة.", "source": "SAE J2012 generic DTC definition; causes/checks = general workshop guidance", "data_status": "standard"}, {"code": "ELC-001", "system": "ELECTRICAL", "subsystem": "12 V Battery", "severity": 2, "hv_risk": 0, "applies_to": "all", "title_en": "Weak or failing 12 V battery", "title_ar": "ضعف بطارية 12 فولت", "description": "", "symptoms": "weak_battery,hard_start,dim_lights,comm_error,no_ready", "causes": "تقادم البطارية، تفريغ متكرر، استهلاك تيار وهي مطفية (parasitic drain)، ضعف الشحن.", "checks": "1) قياس الجهد بعد راحة (12.6V تقريبًا للمشحونة). 2) اختبار البطارية بجهاز اختبار CCA. 3) قياس تيار التسريب بعد نوم الوحدات.", "fix": "شحن أو استبدال البطارية، إصلاح سبب التسريب.", "source": "General workshop practice (no DTC for this condition)", "data_status": "general"}, {"code": "ELC-002", "system": "ELECTRICAL", "subsystem": "Connections", "severity": 2, "hv_risk": 0, "applies_to": "all", "title_en": "Corroded battery terminals / ground straps", "title_ar": "أكسدة أطراف البطارية أو أسلاك الأرضي", "description": "", "symptoms": "corrosion,hard_start,dim_lights,comm_error", "causes": "رطوبة، تسريب حمض البطارية، أطراف غير محكمة.", "checks": "1) فحص بصري. 2) قياس فقد الجهد على الأطراف أثناء التقويم (يجب أن يكون صغيرًا جدًا).", "fix": "تنظيف وإحكام الأطراف واستبدال الأسلاك التالفة.", "source": "General workshop practice (no DTC for this condition)", "data_status": "general"}, {"code": "P0128", "system": "COOLING", "subsystem": "Thermostat", "severity": 2, "hv_risk": 0, "applies_to": "gasoline,diesel,hybrid", "title_en": "Coolant Thermostat (Coolant Temperature Below Thermostat Regulating Temperature)", "title_ar": "الثرموستات - حرارة المياه أقل من حرارة الفتح المطلوبة", "description": "", "symptoms": "check_engine,temp_low,poor_fuel_economy", "causes": "ثرموستات عالق مفتوح، حساس حرارة المياه غير دقيق، المروحة تعمل باستمرار.", "checks": "1) مراقبة زمن وصول المحرك للحرارة الطبيعية. 2) مقارنة ECT بقياس حراري خارجي. 3) التأكد أن المروحة لا تعمل والمحرك بارد. e (no DTC for this condition)", "data_status": "general"}, {"code": "BRK-004", "system": "BRAKING", "subsystem": "Hydraulics", "severity": 4, "hv_risk": 0, "applies_to": "all", "title_en": "Brake fluid leak (visual)", "title_ar": "تسريب زيت فرامل ظاهر", "description": "", "symptoms": "fluid_leak,soft_pedal", "causes": "خرطوم أو ماسورة متآكلة، جلدة كاليبر، طرمبة رئيسية.", "checks": "1) فحص بصري أسفل السيارة وعند العجل (مهمة مناسبة لكاميرا الروبوت). 2) فحص المستوى.", "fix": "استبدال الجزء المسرّب وتهوية الدائرة.", "source": "General workshop practice (no DTC for this condition)", "data_status": "general"}, {"code": "OTH-001", "system": "OTHER", "subsystem": "Exhaust", "severity": 2, "hv_risk": 0, "applies_to": "gasoline,diesel,hybrid", "title_en": "Exhaust leak / damaged exhaust (visual)", "title_ar": "تسريب أو تلف في الشكمان", "description": "", "symptoms": "engine_noise,visible_damage,check_engine", "causes": "شرخ في المانيفولد أو الماسورة، جوان تالف، علاقة مكسورة.", "checks": "1) فحص بصري أسفل السيارة (آثار سناج). 2) الاستماع للصوت مع المحرك بارد.", "fix": "استبدال الجوان أو الجزء التالف.", "source": "General workshop practice (no DTC for this condition)", "data_status": "general"}, {"code": "OTH-002", "system": "OTHER", "subsystem": "Underbody", "severity": 2, "hv_risk": 0, "applies_to": "all", "title_en": "Loose / damaged underbody shield", "title_ar": "واقي أسفل السيارة مفكوك أو تالف", "description": "", "symptoms": "visible_damage,vibration", "causes": "صدمة، مسامير مفقودة.", "checks": "فحص بصري أسفل السيارة بكاميرا الروبوت.", "fix": "تثبيت أو استبدال الواقي.", "source": "General workshop practice (no DTC for this condition)", "data_status": "general"}, {"code": "OTH-003", "system": "OTHER", "subsystem": "Engine Oil", "severity": 3, "hv_risk": 0, "applies_to": "gasoline,diesel,hybrid", "title_en": "Engine oil leak (visual)", "title_ar": "تسريب زيت محرك ظاهر", "description": "", "symptoms": "fluid_leak,burning_smell,visible_damage", "causes": "جوان كارتير، جوان function drawQr(canvas, text) { const m = AutonexQR.matrix(text, "H"), n = m.length, q = 2, ctx = canvas.getContext("2d"), s = canvas.width / (n + 2 * q);

  for (let r = 0; r < n; r++) for (let c = 0; c < n; c++) if (m[r][c]) ctx.fillRect(Math.floor((c + q) * s), Math.floor((r + q) * s), Math.ceil(s), Math.ceil(s));

function faultCard(f, open) { return `<details class="panel" ${open ? "open" : ""}><summary style="cursor:pointer"><b class="mono" style="color:var(--orange);font-size:17px">${esc(f.code)}</b> ${sevTag(f.severity)} ${f.hv_risk ? '<span class="tag bad-t">HV</span>' : ""} <b>${esc(L(f.title_en, f.title_ar))}</b><div class="small muted">${esc(sysName(f.system))} · ${esc(f.applies_to)}</div></summary>

    <h4>${p("Vehicle & customer", "السيارة والعميل")}</h4><table>${row("Customer / العميل", [v.customer_name, v.customer_phone].filter(Boolean).join(" – "))}${row("Vehicle / السيارة", [v.manufacturer, v.model, v.year].filter(Boolean).join(" "))}${row("Type / النوع", ptLabel(v) + (v.fuel_grade ? ` (petrol ${v.fuel_grade})` : ""))}${row("Chassis no. (VIN) / رقم الشاسيه", v.vin)}${row("Plate / Odometer", [v.plate, v.odometer_km ? v.odometer_km + " km" : ""].filter(Boolean).join(" – "))}${row("Transmission / الفتيس", v.transmission)}
      ${v.hv_voltage_v || v.hv_capacity_kwh ? row("HV battery (original spec) / البطارية (القيم الأصلية)", `${v.hv_voltage_v || "-"} V nominal · ${v.hv_capacity_kwh || "-"} kWh · ${v.battery_chemistry || "-"} · ${v.battery_modules || "-"} modules × ${v.cells_per_module || "-"} cells`) : ""}</table>
    <h4>${p("Inspection", "الفحص")}</h4><table>${row("Date / التاريخ", `${i.created_at}${i.closed_at ? " → " + i.closed_at : ""}`)}${row("OBD mode / وضع الـ OBD", i.obd_mode ? "ON – OBD scanner + camera" : "OFF – camera inspection only")}
      ${i.obd_mode ? row("OBD checklist", cl.map(k => (ck[k] ? "☑ " : "☐ ") + T["ck_" + k][0]).join(" | ")) : ""}${row("Complaint / الشكوى", i.complaint)}${row("Fault codes / الأكواد", (i.codes || []).join(", ") || "none")}${row("Symptoms / الأعراض", (i.symptoms || []).map(k => SYM[k] ? SYM[k].en : k).join(", ") || "-")}</table>
    ${d ? `<h4>${p("Detected fault", "العطل الظاهر")} – ${esc(T["conf_" + d.confidence][0])}</h4><p>${esc(d.summary)}</p>${d.codes.map(c => c.status === "found" ? `<p><b>${esc(c.code)}</b> – ${esc(c.fault.title_en)} – <span dir="rtl">${esc(c.fault.title_ar)}</span> [${sevLabel(c.fault.severity)}]<br><small>${esc(c.fault.causes)}</small></p>` : `<p><b>${esc(c.code)}</b> – ${esc(c.message || c.status)}</p>`).join("")}
      ${d.hv_warning ? `<p><b>⚡ HIGH VOLTAGE – qualified EV technician with PPE only.</b></p>` : ""}` : ""}
    ${i.findings.length ? `<h4>${p("Findings", "الأعطال المكتشفة")}</h4>${i.findings.map((f, n) => `<p><b>${n + 1}. ${esc([f.fault_code, f.title_en].filter(Boolean).join(" – ") || "Observation")}</b> [${esc(f.status)} / ${sevLabel(f.severity)}] ${f.title_ar ? `<span dir="rtl">${esc(f.title_ar)}</span>` : ""}<br>${esc([f.location, f.notes].filter(Boolean).join(" – "))}</p>${f.snapshot ? `<img src="${Cam.imgSrc(f.snapshot)}" style="max-width:55%;border-radius:4px">` : ""}`).join("")}` : ""}
    ${d && (d.solutions || []).length || i.findings.some(f => f.fix) ? `<h4>${p("Suggested solutions", "الحلول المقترحة لعلاج العطل")}</h4>${(d ? d.solutions : []).concat(i.findings.filter(f => f.fix && !(d && d.solutions.some(s => s.code === f.fault_code))).map(f => ({ code: f.fault_code, title_en: f.title_en, checks: f.checks, fix: f.fix }))).map(s => `<p><b>${esc(s.code)}</b> ${esc(s.title_en || "")}${s.possible ? " (possible)" : ""}<br><b>Checks:</b> ${esc(s.checks)}<br><b>Repair:</b> ${esc(s.fix)}</p>`).join("")}` : ""}
    ${ba ? `<h4>${p("HV battery measurements", "قياسات البطارية")}</h4>${b.nominal_pack_v || b.capacity_kwh ? `<p>Original specification: ${b.nominal_pack_v || "-"} V nominal, ${b.capacity_kwh || "-"} kWh, ${b.modules} modules × ${b.cells_per_module} cells (${b.chemistry}).</p>` : ""}${bat(ba.before, "Before repair / قبل الإصلاح")}${bat(ba.after, "After repair / بعد الإصلاح")}${ba.verdict ? `<p style="font-size:14px"><b>Result: ${esc(T["verdict_" + ba.verdict][0])} – <span dir="rtl">${esc(T["verdict_" + ba.verdict][1])}</span></b></p>` : ""}` : ""}
    <h4>${p("Repair verification", "التأكد من الإصلاح")}</h4><p style="font-size:14px"><b>${i.verified_fixed ? "✅ The fault is fixed and the vehicle was re-checked OK – تم إصلاح العطل والتأكد إن العربية سليمة" : "☐ Not verified yet – لم يتم التأكيد بعد"}</b><br>${esc(i.verify_notes || "")}</p>
    <h4>${p("Conclusion & recommendation", "النتيجة والتوصية")}</h4><p>${esc(i.conclusion || "-")}<br>${esc(i.recommendation || "")}</p>
    <div class="sig"><div>${tech ? "Prepared by Technician / أعدّه الفني" : "Engineer / المهندس"}: <b>${tech ? "" : "Eng. "}${esc(i.signer_name || i.technician || "")}</b><br>${!tech && DATA.signatures && DATA.signatures[i.signer_name] ? `<img src="${DATA.signatures[i.signer_name]}" style="height:58px;margin:4px 0"><br>Signed / تم التوقيع: ${esc(i.closed_at || i.created_at || "")}` : `<br>Signature / التوقيع: ____________`}</div>
      <div>${tech ? "Reviewed & approved by Engineer (no errors) / مراجعة واعتماد المهندس" : "Robot / النظام"}: <b>${tech ? "" : "AUTONEX"}</b><br><br>${tech ? "Engineer name: ____________  Signature: ____________" : "Faculty of Engineering – Mansoura University"}</div></div>
    ${isEqe(i) ? `<p style="font-size:10px;color:#a55;margin-top:10px">${esc(T.simNote[0])} / <span dir="rtl">${esc(T.simNote[1])}</span></p>` : ""}<p style="font-size:9px;color:#777;margin-top:16px">Database causes and checks are general guidance; confirm with measurements and the manufacturer's service information. Generated by AUTONEX v${esc(DATA.version)}.</p>`; },
  open(i) { const h = this.html(i); $("#report").innerHTML = h;
    if (inFrame || !API.live && !window.print) { modal(`<p class="warn-t small">${t("pdfBlocked")}</p><div class="rp" style="background:#fff;color:#111;padding:10px;border-radius:8px">${h}</div><button class="btn dark" data-act="closeModal" style="margin-top:10px">${t("cancel")}</button>`); return; }
    setTimeout(() => window.print(), 300); },
};

App.init();

</script>
</body>
</html>
